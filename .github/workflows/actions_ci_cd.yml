name:
  tests

on:
  - push

jobs:
  ci_cd:
    name: CI/CD Tests
    runs-on: ubuntu-latest
#    env:
#      HEADLESS: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pyhton
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install

      - name: Run UI tests
        run: |
          pytest -v --tb=line --browser_name=chromium --headless=true test_main_page.py
